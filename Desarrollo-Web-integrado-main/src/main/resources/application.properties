spring.application.name=reciclo
reciclo.datos.archivo=data/residuos.json
spring.jackson.deserialization.fail-on-numbers-for-enums=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Control de acceso por roles para las páginas web.
reciclo.seguridad.activa=true
