spring.application.name=auth-api
server.port=8081

# Base de datos H2 en archivo (persistente)
spring.datasource.url=jdbc:h2:file:./data/authdb
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza las tablas según tus entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# La consola H2 y Swagger sólo se habilitan con el perfil "dev" (application-dev.properties).
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# JWT: la clave NO se guarda en el repositorio. Se lee de la variable RECICLO_JWT_SECRET
# (scripts/iniciar-api.ps1 o docker-compose la generan y la comparten con residuos-api).
reciclo.jwt.secret=${RECICLO_JWT_SECRET:}
reciclo.jwt.expiration-ms=3600000

# Bloqueo temporal tras varios intentos fallidos de inicio de sesión.
reciclo.login.max-intentos=5
reciclo.login.bloqueo-minutos=15
