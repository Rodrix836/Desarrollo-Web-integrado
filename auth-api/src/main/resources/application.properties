spring.application.name=auth-api
server.port=8081

# Base de datos H2 en archivo (persistente)
spring.datasource.url=jdbc:h2:file:./data/authdb
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza las tablas según tus entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Consola H2 (solo desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (clave compartida con residuos-api)
reciclo.jwt.secret=${RECICLO_JWT_SECRET:}
reciclo.jwt.expiration-ms=3600000