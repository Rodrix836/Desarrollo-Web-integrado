spring.application.name=residuos-api
server.port=8082
spring.datasource.url=jdbc:h2:file:./data/residuosdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
