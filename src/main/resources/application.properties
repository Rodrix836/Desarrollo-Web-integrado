spring.application.name=reciclo
spring.datasource.url=jdbc:h2:file:./data/reciclodb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

reciclo.datos.archivo=data/residuos.json
reciclo.datos.cargar-semilla=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Control de acceso por roles para las páginas web.
reciclo.seguridad.activa=true
