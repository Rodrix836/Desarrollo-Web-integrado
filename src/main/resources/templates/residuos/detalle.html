<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Detalle del residuo | ReCiclo')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecera('residuos')}"></header>
<main id="contenido" class="contenedor contenido">
    <a class="volver" th:href="@{/residuos}">Volver a los residuos</a>
    <h1 th:text="${'Residuo #' + residuo.id}">Detalle del residuo</h1>
    <p class="subtitulo">Información del registro de reciclaje.</p>
    <section class="panel formulario" aria-label="Datos del residuo">
        <dl class="detalle">
            <div><dt>Empresa propietaria</dt><dd th:text="${#strings.isEmpty(residuo.empresa) ? 'Sin asignar' : residuo.empresa}"></dd></div>
            <div><dt>Disponibilidad</dt><dd th:text="${residuo.disponible ? 'Disponible para trueque' : 'No publicado'}"></dd></div>
            <div><dt>Tipo de residuo</dt><dd th:text="${residuo.tipoResiduo.etiqueta}"></dd></div>
            <div><dt>Cantidad</dt><dd th:text="${residuo.cantidad}"></dd></div>
            <div><dt>Unidad</dt><dd th:text="${residuo.unidadMedida}"></dd></div>
            <div><dt>Fecha</dt><dd th:text="${#temporals.format(residuo.fecha, 'dd/MM/yyyy')}"></dd></div>
            <div class="descripcion">
                <dt>Descripción</dt>
                <dd th:text="${#strings.isEmpty(residuo.descripcion) ? 'Sin descripción.' : residuo.descripcion}"></dd>
            </div>
            <div class="descripcion"><dt>Qué busca a cambio</dt><dd th:text="${#strings.isEmpty(residuo.intercambioPor) ? 'Sin preferencia indicada.' : residuo.intercambioPor}"></dd></div>
        </dl>
        <div class="acciones">
            <a class="boton" th:href="@{/residuos/{id}/editar(id=${residuo.id})}">Editar residuo</a>
            <a class="enlace-peligro" th:href="@{/residuos/{id}/eliminar(id=${residuo.id})}">Eliminar residuo</a>
        </div>
    </section>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
