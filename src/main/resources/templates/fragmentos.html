<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">ReCiclo</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header class="cabecera" th:fragment="cabecera(activa)">
    <a class="saltar" href="#contenido">Saltar al contenido</a>
    <div class="contenedor navegacion">
        <a class="marca" th:href="@{/}">ReCiclo</a>
        <span class="distintivo" th:if="${session.usuario != null}"
              th:text="${session.usuario.rol == T(pe.reciclo.model.Rol).ADMIN ? 'Administración' : 'Empresa'}"></span>
        <nav aria-label="Navegación principal">
            <a th:href="@{/}" th:attr="aria-current=${activa == 'inicio' ? 'page' : null}">Inicio</a>
            <a th:if="${session.usuario != null and session.usuario.rol == T(pe.reciclo.model.Rol).ADMIN}"
               th:href="@{/admin}" th:attr="aria-current=${activa == 'residuos' ? 'page' : null}">Administración</a>
            <a th:if="${session.usuario != null and session.usuario.rol == T(pe.reciclo.model.Rol).ADMIN}"
               th:href="@{/residuos/nuevo}" th:attr="aria-current=${activa == 'registrar' ? 'page' : null}">Registrar</a>
            <a th:if="${session.usuario != null and session.usuario.rol == T(pe.reciclo.model.Rol).EMPRESA}"
               th:href="@{/empresa}" th:attr="aria-current=${activa == 'empresa' ? 'page' : null}">Materiales</a>
            <a th:if="${session.usuario == null}" th:href="@{/login}">Iniciar sesión</a>
            <a th:if="${session.usuario != null}" th:href="@{/logout}">Cerrar sesión</a>
        </nav>
    </div>
</header>
<header class="cabecera" th:fragment="cabeceraEmpresa(empresa)">
    <a class="saltar" href="#contenido">Saltar al contenido</a>
    <div class="contenedor navegacion">
        <a class="marca" th:href="@{/empresa}">ReCiclo</a>
        <span class="distintivo">Vista empresa</span>
        <nav aria-label="Navegación de empresa">
            <a th:href="@{/empresa}">Materiales disponibles</a>
            <a th:href="@{/logout}">Cerrar sesión</a>
        </nav>
    </div>
</header>
<footer class="contenedor pie" th:fragment="pie">
    ReCiclo · Registro de residuos reciclables
</footer>
</body>
</html>
