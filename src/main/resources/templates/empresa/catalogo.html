<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Materiales para trueque | ReCiclo')}"></head>
<body>
<header th:replace="~{fragmentos :: cabeceraEmpresa(${empresaActual})}"></header>
<main id="contenido" class="contenedor contenido">
    <p class="etiqueta">Trueque entre empresas</p>
    <h1>Materiales disponibles</h1>
    <p class="subtitulo">Empresa representada: <strong th:text="${empresaActual}"></strong>.</p>

    <section class="panel vacio" th:if="${#lists.isEmpty(ofertas)}">
        <h2>No hay materiales disponibles por ahora</h2>
        <p>Cuando otras empresas tengan materiales disponibles, podrás consultarlos aquí.</p>
    </section>
    <div class="catalogo" th:unless="${#lists.isEmpty(ofertas)}">
        <article class="panel oferta" th:each="residuo : ${ofertas}">
            <p class="empresa-oferta" th:text="${residuo.empresa}"></p>
            <h2 th:text="${residuo.tipoResiduo.etiqueta}"></h2>
            <p class="cantidad-oferta" th:text="${residuo.cantidad + ' ' + residuo.unidadMedida + ' disponibles'}"></p>
            <p th:text="${#strings.isEmpty(residuo.descripcion) ? 'Consulta los detalles de este material.' : residuo.descripcion}"></p>
            <div class="intercambio">
                <strong>Busca a cambio</strong>
                <p th:text="${#strings.isEmpty(residuo.intercambioPor) ? 'Sin preferencia indicada.' : residuo.intercambioPor}"></p>
            </div>
            <a class="boton secundario" th:href="@{/empresa/materiales/{id}(id=${residuo.id})}">Ver detalles para trueque</a>
        </article>
    </div>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
